<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAQA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#000;color:#fff;overflow:hidden;height:100vh}
.bg{position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920') center/cover;z-index:0;transition:.5s}
.bg.dim{filter:brightness(.6)}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;z-index:10}
.logo{font-weight:900;font-size:22px;letter-spacing:3px}
.logo span{color:#a78bfa}
.search{flex:1;max-width:420px;margin:0 15px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:30px;display:flex;align-items:center;padding:8px 14px}
.search input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:15px}
.search input::placeholder{color:#ddd}
.top-btns{display:flex;gap:8px}
.top-btns button{background:rgba(255,255,255,.15);border:0;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:17px}
#hero{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
.clock-wrap{text-align:center;transition:.4s}
.clock{font-size:110px;font-weight:200;line-height:1;text-shadow:0 10px 40px rgba(0,0,0,.5)}
.date{font-size:20px;opacity:.9;margin-top:5px}
.greet{font-size:16px;opacity:.8;margin-top:8px}
.widgets{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap;justify-content:center;transition:.4s}
.widget{background:rgba(255,255,255,.14);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:14px 16px;min-width:150px;text-align:center}
.widget b{display:block;font-size:14px;opacity:.9}
.widget span{font-size:22px;font-weight:700}
.links{display:flex;gap:12px;margin-top:20px}
.links a{background:rgba(0,0,0,.35);color:#fff;text-decoration:none;padding:9px 16px;border-radius:20px;font-size:14px;backdrop-filter:blur(10px)}
#settings{position:fixed;top:0;left:0;bottom:0;width:300px;background:#111;padding:20px;z-index:50;transform:translateX(-110%);transition:.35s;overflow:auto}
#settings.open{transform:none}
#settings h3{margin-bottom:14px}
.opt{margin-bottom:16px}
.opt label{display:block;font-size:14px;margin-bottom:6px;opacity:.8}
.opt input,.opt select{width:100%;padding:10px;border-radius:10px;border:0;background:#222;color:#fff}
.bg-opt{display:flex;gap:8px;flex-wrap:wrap}
.bg-opt img{width:70px;height:48px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent}
.bg-opt img.active{border-color:#a78bfa}
.close{position:absolute;top:12px;left:12px;background:#222;border:0;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer}
@media(max-width:600px){.clock{font-size:72px}.search{display:none}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<header>
<div class="logo">DA<span>QA</span></div>
<div class="search"><span>🔍</span><input id="searchInput" placeholder="ابحث في جوجل..."></div>
<div class="top-btns"><button id="themeBtn">🌙</button><button id="settingsBtn">⚙️</button></div>
</header>
<div id="hero">
<div class="clock-wrap" id="clockWrap">
<div class="clock" id="clock">10:58</div>
<div class="date" id="date">الاثنين، 23 نوفمبر</div>
<div class="greet" id="greet">صباح الخير يا أحمد ☀️</div>
</div>
<div class="widgets" id="widgets">
<div class="widget"><b>🌤️ الطقس - الإسكندرية</b><span>24° مشمس</span></div>
<div class="widget"><b>📅 اليوم</b><span id="dayNum">23 نوفمبر</span></div>
<div class="widget"><b>📝 ملاحظة</b><span style="font-size:15px">ركز، يومك هيبقى عظيم</span></div>
</div>
<div class="links">
<a href="https://youtube.com">▶️ يوتيوب</a>
<a href="https://facebook.com">📘 فيسبوك</a>
<a href="https://google.com">🔍 جوجل</a>
<a href="https://chatgpt.com">🤖 شات جي بي تي</a>
</div>
</div>
<div id="settings">
<button class="close" id="closeSettings">✕</button>
<h3>⚙️ الإعدادات</h3>
<div class="opt"><label>اسمك</label><input id="nameInput" value="أحمد"></div>
<div class="opt"><label>الخلفية</label><div class="bg-opt" id="bgList"></div></div>
<div class="opt"><label>لون الساعة</label><input type="color" id="clockColor" value="#ffffff"></div>
<div class="opt"><label>حجم الساعة</label><select id="clockSize"><option value="72px">صغير</option><option value="110px" selected>وسط</option><option value="150px">كبير</option></select></div>
<p style="font-size:13px;opacity:.6;line-height:1.7">دبل كليك = الساعة قدام / ورا الخلفية<br>ضغطة مطولة = فتح الإعدادات</p>
</div>
<script>
const bgs=[
'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920',
'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920',
'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920',
'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1920',
'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1920'
];
const bgEl=document.getElementById('bg');
const bgList=document.getElementById('bgList');
bgs.forEach((u,i)=>{
  let im=document.createElement('img'); im.src=u;
  if(i==0) im.classList.add('active');
  im.onclick=()=>{ bgEl.style.backgroundImage=`url('${u}')`; document.querySelectorAll('.bg-opt img').forEach(x=>x.classList.remove('active')); im.classList.add('active'); };
  bgList.appendChild(im);
});
function tick(){
  let d=new Date();
  let h=d.getHours(), m=d.getMinutes();
  document.getElementById('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
  document.getElementById('date').textContent=d.toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('dayNum').textContent=d.getDate()+' '+d.toLocaleDateString('ar-EG',{month:'long'});
  let g = h<12 ? 'صباح الخير' : h<18 ? 'نهارك سعيد' : 'مساء الخير';
  let name=document.getElementById('nameInput').value||'أحمد';
  document.getElementById('greet').textContent=g+' يا '+name+' ☀️';
}
setInterval(tick,1000); tick();
document.getElementById('searchInput').addEventListener('keydown',e=>{
  if(e.key=='Enter' && e.target.value.trim()) window.open('https://www.google.com/search?q='+encodeURIComponent(e.target.value),'_blank');
});
let dark=false;
document.getElementById('themeBtn').onclick=()=>{ dark=!dark; document.getElementById('themeBtn').textContent=dark?'☀️':'🌙'; bgEl.classList.toggle('dim',dark); };
let settings=document.getElementById('settings');
document.getElementById('settingsBtn').onclick=()=>settings.classList.add('open');
document.getElementById('closeSettings').onclick=()=>settings.classList.remove('open');
document.getElementById('clockColor').oninput=e=>document.getElementById('clock').style.color=e.target.value;
document.getElementById('clockSize').onchange=e=>document.getElementById('clock').style.fontSize=e.target.value;
let front=true;
document.getElementById('hero').addEventListener('dblclick',()=>{
  front=!front;
  document.getElementById('clockWrap').style.opacity=front?'1':'0.15';
  document.getElementById('widgets').style.opacity=front?'1':'0.15';
});
let timer;
let hero=document.getElementById('hero');
hero.addEventListener('mousedown',()=>{ timer=setTimeout(()=>settings.classList.add('open'),600); });
hero.addEventListener('mouseup',()=>clearTimeout(timer));
hero.addEventListener('touchstart',()=>{ timer=setTimeout(()=>settings.classList.add('open'),600); },{passive:true});
hero.addEventListener('touchend',()=>clearTimeout(timer));
</script>
</body>
</html>
