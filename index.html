<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAQA | خلفيات بدقة عالية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff}
header{padding:20px;text-align:center;background:#000;position:sticky;top:0;z-index:10}
header h1{font-size:32px;letter-spacing:3px}
header h1 span{color:#00ff88}
header p{color:#aaa;margin-top:5px}
.search{padding:15px;text-align:center}
.search input{width:90%;max-width:400px;padding:12px;border-radius:25px;border:none;outline:none;font-size:16px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{border-radius:15px;overflow:hidden;background:#1a1a1a}
.card img{width:100%;height:220px;object-fit:cover;display:block}
.card .info{padding:10px;display:flex;justify-content:space-between;align-items:center}
.card button{background:#00ff88;border:none;padding:8px 15px;border-radius:20px;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:20px;color:#666}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.card img{height:300px}}
</style>
</head>
<body>
<header>
<h1>DAQA <span>دقة</span></h1>
<p>موقع خلفيات بدقة عالية</p>
</header>

<div class="search">
<input type="text" id="searchInput" placeholder="ابحث عن خلفية... طبيعة، سيارات، انمي" onkeyup="searchWall()">
</div>

<div class="grid" id="grid"></div>
<footer>© 2026 DAQA - جميع الحقوق محفوظة</footer>

<script>
const walls=[
{name:"طبيعة 1",img:"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800"},
{name:"طبيعة 2",img:"https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800"},
{name:"جبال",img:"https://images.unsplash.com/photo-1454496522488-7a8e488e8606?w=800"},
{name:"بحر",img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800"},
{name:"مدينة",img:"https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800"},
{name:"فضاء",img:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=800"},
{name:"سيارات",img:"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=800"},
{name:"انمي",img:"https://images.unsplash.com/photo-1578632767115-351597cf2477?w=800"},
{name:"حيوانات",img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=800"},
{name:"ورود",img:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800"},
{name:"صحراء",img:"https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=800"},
{name:"ليل",img:"https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800"}
];
function show(list){
document.getElementById("grid").innerHTML=list.map(w=>`
<div class="card">
<img src="${w.img}" loading="lazy">
<div class="info"><span>${w.name}</span><button onclick="downloadWall('${w.img}','${w.name}')">تحميل</button></div>
</div>`).join("");
}
function searchWall(){
let v=document.getElementById("searchInput").value;
show(walls.filter(w=>w.name.includes(v)));
}
function downloadWall(url,name){
let a=document.createElement("a");
a.href=url; a.download=name+".jpg"; a.target="_blank"; a.click();
}
show(walls);
</script>
</body>
</html>
