<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAQA - دقة</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{height:100vh;overflow:hidden;color:#fff}
#bg{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity .5s;z-index:0}
#bg:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.35))}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font-weight:900;font-size:22px}
.top span{font-size:14px;font-weight:400;opacity:.9}
.info{position:relative;z-index:2;display:flex;justify-content:space-between;padding:10px 20px;margin-top:20px}
.info b{font-size:20px}
.info p{font-size:13px;opacity:.9}
.clock{position:relative;z-index:2;text-align:center;margin-top:25px;transition:.3s}
.clock p{font-size:17px}
.clock h1{font-size:95px;line-height:1;font-weight:900;letter-spacing:-2px;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.hint{position:relative;z-index:2;text-align:center;margin-top:90px;font-size:13px;background:rgba(0,0,0,.35);display:block;width:fit-content;margin-left:auto;margin-right:auto;padding:8px 16px;border-radius:20px}
.btns{position:fixed;bottom:20px;left:15px;right:15px;z-index:5;display:flex;gap:12px}
.btns button{flex:1;padding:15px;border:none;border-radius:30px;font-size:16px;font-weight:900;cursor:pointer}
.btns button:first-child{background:#fff;color:#000}
.btns button:last-child{background:#e63946;color:#fff}
</style>
</head>
<body>
<div id="bg"></div>
<div class="top"><div>DAQA <span>دقة</span></div><div>↗</div></div>
<div class="info">
<div>🔋 <b>94%</b><p>Battery Level</p></div>
<div style="text-align:right">🌡 <b>29°</b><p>26 30</p></div>
</div>
<div class="clock" id="clock"><p id="date">Monday, November 23</p><h1 id="time">18:37</h1></div>
<div class="hint">كليك يخفي / ضغطتين يخلي الساعة قدام وورا</div>
<div class="btns">
<button onclick="downloadBg(event)">تنزيل ⬇</button>
<button onclick="changeBg(event)">خلفية عشوائية 🔄</button>
</div>

<script>
const imgs=[
"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1080&q=80",
"https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1080&q=80",
"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1080&q=80",
"https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1080&q=80",
"https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1080&q=80",
"https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1080&q=80",
"https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1080&q=80",
"https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1080&q=80"
];
let cur=0;
const bg=document.getElementById('bg');
bg.style.backgroundImage=`url('${imgs[0]}')`;

// تحميل الصور في الخلفية عشان تتطبق علطول من غير تحميل
imgs.forEach(src=>{let i=new Image();i.src=src});

function changeBg(e){
  if(e) e.stopPropagation();
  cur=(cur+1)%imgs.length;
  bg.style.opacity=0;
  setTimeout(()=>{
    bg.style.backgroundImage=`url('${imgs[cur]}')`;
    bg.style.opacity=1;
  },200);
}

async function downloadBg(e){
  if(e) e.stopPropagation();
  try{
    let r=await fetch(imgs[cur]);
    let b=await r.blob();
    let u=URL.createObjectURL(b);
    let a=document.createElement('a');
    a.href=u; a.download='DAQA-'+(cur+1)+'.jpg';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(err){ alert('دوس دوسة طويلة على الصورة واحفظها'); window.open(imgs[cur],'_blank'); }
}

let clickTimer=null;
document.body.addEventListener('click',()=>{
  if(clickTimer){clearTimeout(clickTimer);clickTimer=null;let c=document.getElementById('clock');c.style.zIndex=c.style.zIndex=='0'?'5':'0';return}
  clickTimer=setTimeout(()=>{clickTimer=null;let c=document.getElementById('clock');c.style.opacity=c.style.opacity=='0'?'1':'0'},250);
});

function clock(){
  let n=new Date();
  document.getElementById('time').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'});
}
setInterval(clock,1000); clock();
</script>
</body>
</html>
